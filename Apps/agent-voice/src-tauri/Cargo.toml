[package]
name = "agent-voice"
version = "0.1.0"
description = "Local-first voice input for coding agents — push-to-talk dictation powered by whisper.cpp"
authors = ["agent-voice contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.0"
tauri-plugin-clipboard-manager = "2.4.1"
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
cpal = "0.18.2"
whisper-rs = "0.16.0"
enigo = "0.6.1"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
sha2 = "0.11.0"
base64 = "0.23.1"
uuid = { version = "1.27.0", features = ["v4"] }
dirs = "7.0.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
