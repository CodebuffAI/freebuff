<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!--
    The Freebuff Pro sponsor-break HERO (COD-486).

    Authored, not sourced: a break's hero is the thing the card is built
    around, and a stock photograph would say nothing about what the plan buys.
    Dark ground (#0a0a0b, the product's own), one accent (#7CFF3F, the mark's
    green), and the benefit stated in the plan's own numbers.

    THE NUMBERS ARE THE CATALOG'S. `3` and `$8/mo` are `dailySessions` and
    `priceUsd` of `FREEBUFF_SUBSCRIPTION_TIERS[0]`, which have been resized
    before (2026-08-27). A picture cannot interpolate them, so
    `scripts/__tests__/house-hero-asset.test.ts` asserts this file still agrees
    with that catalog — a reprice fails there instead of shipping a hero that
    quotes a price checkout would refuse.

    Rendered to `freebuff-pro-hero-1600x1000.png` at 1600x1000 (16:10, the
    ratio `SPONSOR_BREAK_HERO_SPEC` asks for). The PNG is what ships; this is
    its source.
  -->
  <defs>
    <radialGradient id="glow" cx="0.78" cy="0.28" r="0.75">
      <stop offset="0%" stop-color="#7CFF3F" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#7CFF3F" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#7CFF3F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7CFF3F" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7CFF3F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#0a0a0b"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- The mark, from freebuff/web/public/freebuff-logo.svg, unmodified. -->
